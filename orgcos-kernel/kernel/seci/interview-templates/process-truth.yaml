# Process Truth Interview Template
# Target Layer: L3
# Output: OperationalDefinition entries (with actual_flow)

interview:
  type: "process-truth"
  name_zh: "流程真相访谈"
  target_layer: "L3"
  duration_minutes: 60
  interviewee_profile: "Frontline employees, team leads, process owners"
  output_entry_type: "OperationalDefinition"
  anonymity_required: true  # Edmondson: psychological safety for honest answers

  core_questions:
    1: "Walk me through how this process actually works, step by step."
    2: "How is the actual process different from the documented SOP?"
    3: "Why did the deviation happen? Was it intentional or accidental?"
    4: "Who do you actually go to for approval (vs. who the org chart says)?"
    5: "What shortcuts have you developed that aren't in the official process?"
    6: "When does the 'rubber stamp' happen -- where approvals are just formality?"
    7: "What happens when you follow the SOP exactly? Does it slow things down?"
    8: "What informal checks do you do before submitting something officially?"
    9: "If a new employee followed only the SOP, what problems would they face?"
    10: "Has anyone ever been punished for using the shortcut instead of the official process?"

  follow_up_prompts:
    - "Can you draw the actual flow on this whiteboard?"
    - "Who else does this differently?"
    - "What would happen if management discovered this deviation?"

  extraction_rules:
    dual_version_required: true  # Must capture both official_flow and actual_flow
    deviation_fields: ["deviation_reason", "deviation_severity", "deviation_type"]
    collection_method: "anonymous_interview"
