# SECI E-Phase: Externalization Toolkit
# Weeks 3-4: Tacit to Explicit

toolkit:
  phase: "E"
  name: "Externalization"
  tools:
    - id: "structured_interview_templates"
      name: "Structured Interview Templates"
      name_zh: "结构化访谈模板"
      description: "5 standard interview types, each with 10 core questions"
      templates:
        - "strategic-tradeoff"
        - "process-truth"
        - "failure-retrospective"
        - "org-character"
        - "semantic-alignment"
      output: ["L5 case entries", "L6 character entries", "L2 strategic tradeoffs"]

    - id: "expert_decision_pattern_collector"
      name: "Expert Decision Pattern Collector"
      name_zh: "专家决策模式采集器"
      input: ["interview_recordings", "workshop_whiteboard_records"]
      output: ["decision_pattern_labels", "heuristic_rules", "context_conditions"]
      method: "Extract expert decision heuristics from interviews and workshop discussions"

    - id: "seci_workshop_process"
      name: "SECI Workshop Standard Process"
      name_zh: "SECI 工作坊标准流程"
      duration_hours: 4
      participants: 8-15
      agenda:
        - {time: "0:00-0:30", activity: "Context setting and warm-up"}
        - {time: "0:30-1:30", activity: "Individual reflection and story sharing"}
        - {time: "1:30-2:30", activity: "Group discussion and pattern extraction"}
        - {time: "2:30-3:30", activity: "Structured knowledge capture (using interview templates)"}
        - {time: "3:30-4:00", activity: "Review and commitment to action"}
      output: ["workshop_notes", "context_entries_draft", "action_items"]
