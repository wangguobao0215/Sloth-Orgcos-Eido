# Context Assemble API Endpoint
# POST /api/v1/context/assemble

paths:
  /context/assemble:
    post:
      summary: "Context Assemble - multi-layer organizational context for AI"
      description: "Assemble complete organizational context from all 6 layers for a specific scenario, suitable for AI system prompt injection"
      operationId: "contextAssemble"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario:
                  type: object
                  required: [role, task]
                  properties:
                    role:
                      type: string
                      description: "The role requesting context (e.g., senior_presales, dept_manager)"
                    customer_industry:
                      type: string
                    customer_tier:
                      type: string
                    task:
                      type: string
                      description: "The specific task (e.g., prepare_solution_proposal)"
                options:
                  type: object
                  properties:
                    max_layers:
                      type: integer
                      default: 6
                      minimum: 1
                      maximum: 6
                    include_memory:
                      type: boolean
                      default: true
                    memory_top_k:
                      type: integer
                      default: 5
                    include_character:
                      type: boolean
                      default: true
                    perspective:
                      type: string
                      enum: [strategic, operational, technical]
                      description: "Multi-perspective view preference (P7)"
                    min_confidence:
                      type: number
                      default: 0.5
                      minimum: 0
                      maximum: 1
      responses:
        "200":
          description: "Assembled context"
          content:
            application/json:
              schema:
                type: object
                properties:
                  assembled_context:
                    type: object
                    properties:
                      L1_entities:
                        type: array
                        items:
                          type: object
                          properties:
                            type: {type: string}
                            count: {type: integer}
                            summary: {type: string}
                      L2_strategy:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string}
                            content: {type: string}
                            confidence: {type: number}
                      L3_operations:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string}
                            content: {type: string}
                      L4_semantics:
                        type: array
                        items:
                          type: object
                          properties:
                            term: {type: string}
                            definition: {type: string}
                      L5_memories:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string}
                            lesson: {type: string}
                      L6_character:
                        type: object
                        properties:
                          risk_appetite: {type: string}
                          prompt_injection: {type: string}
                  metadata:
                    type: object
                    properties:
                      total_entries: {type: integer}
                      avg_confidence: {type: number}
                      warnings:
                        type: array
                        items: {type: string}
